<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Borde del rectángulo -->
  <rect x="20" y="20" width="760" height="360" rx="20" ry="20" 
        fill="white" stroke="#1e3a6e" stroke-width="6"/>
  
  <!-- Gota de agua -->
  <g transform="translate(400, 100)">
    <defs>
      <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#7dd3fc;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path d="M 0 -40 Q -20 -10 -25 15 Q -25 35 0 35 Q 25 35 25 15 Q 20 -10 0 -40 Z" 
          fill="url(#dropGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <ellipse cx="-8" cy="10" rx="4" ry="8" fill="white" opacity="0.6"/>
    <circle cx="15" cy="-25" r="3" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Texto SAHEL -->
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="110" font-weight="900" 
        text-anchor="middle" fill="#1e3a6e" letter-spacing="2">SAHEL</text>
  
  <!-- Texto PRODUITS D'HYGIÈNE -->
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="42" font-weight="500" 
        text-anchor="middle" fill="#1e3a6e" letter-spacing="3">PRODUITS D'HYGIÈNE</text>
</svg>
