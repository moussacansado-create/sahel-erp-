# Supervisión de CleanSahel ERP.
#
# ESTE FICHERO VIVE EN EL REPO Y NO SÓLO EN /etc.
#
# `/etc/supervisor/conf.d/` está en el contenedor, que es efímero: cuando el
# contenedor se reinicia, la configuración se va y los tres procesos se quedan
# sin dueño. La base de datos y los respaldos sobreviven porque están en NFS;
# esto no, y sin esto el sistema vuelve a ficar en silencio.
#
# Por eso está aquí versionado, y se instala con:
#     cp infra/sahel.conf /etc/supervisor/conf.d/sahel.conf
#     supervisord -c /etc/supervisor/supervisord.conf

[program:sahel-app]
command=/usr/local/bin/node /workspace/cleansahel-v2/server/arrancar.mjs
directory=/workspace/cleansahel-v2/server
autostart=true
autorestart=true
startsecs=10
startretries=20
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/cleansahel-v2/registros/app.log
stderr_logfile=/workspace/cleansahel-v2/registros/app-error.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB

[program:sahel-tunel]
command=/bin/bash /workspace/cleansahel-v2/tunel.sh
directory=/workspace/cleansahel-v2
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/workspace/cleansahel-v2/registros/tunel.log
stderr_logfile=/workspace/cleansahel-v2/registros/tunel-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:sahel-respaldo]
command=/bin/bash -c 'while true; do /usr/local/bin/node /workspace/cleansahel-v2/server/respaldar.mjs; sleep 21600; done'
directory=/workspace/cleansahel-v2
autostart=true
autorestart=true
startsecs=30
startretries=5
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/workspace/cleansahel-v2/registros/respaldo.log
stderr_logfile=/workspace/cleansahel-v2/registros/respaldo-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
